<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VerdantCare - Plant Care & Greenhouse Shop</title>
<!-- Material Symbols Outlined font for icons -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<!-- Google Fonts: Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #2d6a4f;
    --accent-hover: #1b4332;
    --accent-light: #e8f5e9;
    --accent-subtle: #d8f3dc;
    --bg: #f7faf8;
    --surface: #ffffff;
    --border: #e2e8e3;
    --text-primary: #1b261d;
    --text-secondary: #526355;
    --user-msg-bg: #2d6a4f;
    --user-msg-text: #ffffff;
    --bot-msg-bg: #ffffff;
    --bot-msg-border: #e2e8e3;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 14px rgba(45, 106, 79, 0.08);
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .brand-icon {
    width: 36px;
    height: 36px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
  }
  .brand-title {
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }
  .brand-subtitle {
    font-size: 0.8rem;
    color: var(--text-secondary);
    font-weight: 400;
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.78rem;
    background: var(--accent-light);
    color: var(--accent);
    padding: 0.25rem 0.65rem;
    border-radius: 20px;
    font-weight: 600;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    background: #40c057;
    border-radius: 50%;
  }

  /* Main Container & Chat Log */
  main {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }

  /* Chat Messages & Bubbles */
  .msg-row {
    display: flex;
    gap: 0.75rem;
    max-width: 88%;
  }
  .msg-row.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg-row.bot {
    align-self: flex-start;
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .msg-row.user .avatar {
    background: var(--accent-hover);
    color: #fff;
  }
  .msg-row.bot .avatar {
    background: var(--accent-light);
    color: var(--accent);
    border: 1px solid var(--border);
  }

  .bubble-wrapper {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .bubble {
    padding: 0.8rem 1.1rem;
    border-radius: var(--radius-lg);
    font-size: 0.95rem;
    line-height: 1.52;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: var(--shadow-sm);
  }

  .msg-row.user .bubble {
    background: var(--user-msg-bg);
    color: var(--user-msg-text);
    border-bottom-right-radius: 4px;
  }

  .msg-row.bot .bubble {
    background: var(--bot-msg-bg);
    color: var(--text-primary);
    border: 1px solid var(--bot-msg-border);
    border-bottom-left-radius: 4px;
  }

  /* When the reply contains A2UI cards, transparent chrome */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    white-space: normal;
  }

  /* Typing Indicator */
  .typing-indicator {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0.6rem 0.9rem;
  }
  .dot {
    width: 7px;
    height: 7px;
    background: var(--text-secondary);
    border-radius: 50%;
    opacity: 0.6;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .dot:nth-child(1) { animation-delay: -0.32s; }
  .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1.0); }
  }

  /* Quick Suggestion Prompts Row */
  .prompt-suggestions {
    padding: 0.5rem 1.2rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    max-width: 100%;
    box-sizing: border-box;
    flex-shrink: 0;
  }
  .prompt-chip {
    width: auto;
    height: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 0.45rem 0.9rem;
    border-radius: 20px;
    font-size: 0.83rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: var(--shadow-sm);
    white-space: nowrap;
  }
  .prompt-chip:hover {
    background: var(--accent-light);
    color: var(--accent);
    border-color: var(--accent-subtle);
    transform: translateY(-1px);
  }

  /* Input Form Footer */
  footer {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 0.75rem 1.2rem 1.2rem 1.2rem;
  }

  form {
    display: flex;
    gap: 0.6rem;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 0.35rem 0.4rem 0.35rem 1rem;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  form:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.12);
  }

  input {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text-primary);
    outline: none;
  }
  input::placeholder {
    color: var(--text-secondary);
    opacity: 0.7;
  }

  form button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
    flex-shrink: 0;
  }
  form button:hover {
    background: var(--accent-hover);
    transform: scale(1.04);
  }
  form button:active {
    transform: scale(0.96);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.1rem;
    background: var(--surface);
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.6rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.4rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.65rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-caption { font-size: 0.83rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: var(--radius-md); display: block; border: 1px solid var(--border); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.2rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">🌿</div>
    <div>
      <div class="brand-title">VerdantCare</div>
      <div class="brand-subtitle">Plant Care & Greenhouse Shop Assistant</div>
    </div>
  </div>
  <div class="status-badge">
    <span class="status-dot"></span>
    Online
  </div>
</header>

<main>
  <div id="log"></div>
  
  <!-- Clickable 3 Example Prompts -->
  <div class="prompt-suggestions">
    <button class="prompt-chip" onclick="usePrompt('🌿 Recommend pet-safe indoor plants for low-light rooms')">
      <span>🌿</span> Pet-safe indoor plants
    </button>
    <button class="prompt-chip" onclick="usePrompt('🪴 Calculate fertilizer dosage for a 5-gallon Monstera')">
      <span>🪴</span> Fertilizer dosage calculator
    </button>
    <button class="prompt-chip" onclick="usePrompt('📍 Find plant nurseries & greenhouse shops near San Francisco')">
      <span>📍</span> Nearby greenhouse shops
    </button>
  </div>
</main>

<footer>
  <form id="form">
    <input id="input" placeholder="Ask about plant care, product availability, care math..." autocomplete="off" autofocus>
    <button aria-label="Send message">
      <span class="material-symbols-outlined" style="color:#fff; font-size:1.3rem;">send</span>
    </button>
  </form>
</footer>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function appendMessage(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "🌿");
  const wrapper = el("div", "bubble-wrapper");
  const b = el("div", "bubble");
  
  wrapper.appendChild(b);
  row.appendChild(avatar);
  row.appendChild(wrapper);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

function showTyping() {
  const row = el("div", "msg-row bot", null);
  row.id = "typing-row";
  const avatar = el("div", "avatar", "🌿");
  const wrapper = el("div", "bubble-wrapper");
  const b = el("div", "bubble");
  const typing = el("div", "typing-indicator");
  typing.appendChild(el("span", "dot"));
  typing.appendChild(el("span", "dot"));
  typing.appendChild(el("span", "dot"));
  b.appendChild(typing);
  wrapper.appendChild(b);
  row.appendChild(avatar);
  row.appendChild(wrapper);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById("typing-row");
  if (t) t.remove();
}

function usePrompt(promptText) {
  input.value = promptText;
  send(promptText);
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  if (type === "Card") {
    const card = el("div", "a2card");
    for (const k of kids()) card.appendChild(k);
    return card;
  }
  if (type === "Column") {
    const col = el("div", "a2col");
    for (const k of kids()) col.appendChild(k);
    return col;
  }
  if (type === "Row") {
    const row = el("div", "a2row");
    if (props.distribution === "spaceBetween") row.classList.add("between");
    for (const k of kids()) row.appendChild(k);
    return row;
  }
  if (type === "Text") {
    const text = boundStr(props.text);
    const hint = boundStr(props.usageHint);
    const tag = (hint === "h1" || hint === "h2" || hint === "h3" || hint === "h4") ? hint : "p";
    const p = el(tag, "a2text " + (hint ? "a2-" + hint : ""), text);
    return p;
  }
  if (type === "Divider") return el("hr", "a2divider");
  if (type === "List") {
    const col = el("div", "a2col");
    for (const k of kids()) col.appendChild(k);
    return col;
  }
  if (type === "Image") {
    const url = boundStr(props.url);
    if (!/^https?:\/\//i.test(url)) return null;
    const img = el("img", "a2img");
    img.src = url;
    const alt = boundStr(props.fit);
    if (alt) img.alt = alt;
    return img;
  }
  if (type === "Icon") {
    const name = iconName(boundStr(props.name));
    return el("span", "material-symbols-outlined", name);
  }
  return null;
}

function renderA2uiSurface(messages) {
  const comps = {};
  let rootId = null;
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") {
      rootId = m.beginRendering.root;
    }
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) {
      for (const c of su.components) {
        if (c && typeof c.id === "string" && c.component) comps[c.id] = c.component;
      }
    }
  }
  if (!rootId || !comps[rootId]) return null;
  return buildNode(rootId, comps, new Set());
}

/* ----------------------------------------------------------------------------
 * Chat loop: POST /chat, handle response parts (text or a2ui).
 * -------------------------------------------------------------------------- */
async function send(text) {
  const userBubble = appendMessage("user");
  userBubble.textContent = text;
  input.value = "";

  showTyping();

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    removeTyping();

    const botBubble = appendMessage("bot");
    const parts = data.parts || [];
    const a2uiMessages = [];
    const textLines = [];

    for (const p of parts) {
      if (p.kind === "a2ui" && p.data) a2uiMessages.push(p.data);
      else if (p.kind === "text" && p.text) textLines.push(p.text);
    }

    let renderedRich = false;
    if (a2uiMessages.length > 0) {
      const surfaceNode = renderA2uiSurface(a2uiMessages);
      if (surfaceNode) {
        botBubble.classList.add("rich");
        botBubble.appendChild(surfaceNode);
        renderedRich = true;
      }
    }

    if (!renderedRich) {
      botBubble.textContent = textLines.join("\n\n") || "(No reply received)";
    }
  } catch (err) {
    removeTyping();
    const botBubble = appendMessage("bot");
    botBubble.textContent = "Error: " + err.message;
  }
}

form.onsubmit = (e) => {
  e.preventDefault();
  const v = input.value.trim();
  if (!v) return;
  send(v);
};
</script>
</body>
</html>
